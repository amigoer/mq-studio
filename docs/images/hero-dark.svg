  <title id="title">MQ Studio</title>
  <desc id="desc">The MQ Studio app icon and name above the fifteen message brokers it connects to: RocketMQ, Kafka, RabbitMQ, Pulsar, Redis Stream, MQTT, NATS, ActiveMQ, NSQ, Amazon SQS, Google Pub/Sub, Azure Service Bus, Amazon Kinesis, IBM MQ, Solace PubSub+.</desc>

