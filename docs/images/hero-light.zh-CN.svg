<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">MQ Studio</title>
  <desc id="d">MQ Studio：本地优先的消息队列桌面客户端。一套界面连接 RocketMQ、RabbitMQ 与 Kafka，更多驱动陆续接入，无需部署 Web 控制台。</desc>

  <!-- eyebrow -->
  <text x="10" y="50" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" letter-spacing="3" fill="#71717A">LOCAL-FIRST · NOTHING TO DEPLOY · OPEN SOURCE</text>

  <!-- logo tile + wordmark -->
  <g id="lockup">
    <rect x="10" y="76" width="88" height="88" rx="19.8" fill="#EC3013"/>
    <g transform="translate(22.86 96.761) scale(0.46478)" fill="none" stroke-width="10">
      <path d="M12 74 L12 26 L34 55 L56 26 L56 74" stroke="#F3F2F2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="98" cy="50" r="24" stroke="#F3F2F2"/>
      <line x1="109" y1="63" x2="120" y2="74" stroke="#201E1D" stroke-linecap="round"/>
    </g>
    <text x="126" y="142" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="60" font-weight="800" letter-spacing="-1" fill="#18181B">MQ Studio</text>
  </g>

  <!-- value -->
  <text x="10" y="219" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="30" font-weight="600" letter-spacing="1" fill="#3F3F46">消息队列桌面客户端</text>
  <text x="10" y="255" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="20.5" fill="#71717A">管理集群、Topic、消费者与消息 — 无需部署 Web 控制台。</text>

  <!-- metadata -->
  <g id="meta">
    <rect x="10" y="286" width="202" height="36" rx="18" fill="none" stroke="#E0E0E3" stroke-width="1.5"/>
    <circle cx="32" cy="304" r="4.5" fill="#29915D"/>
    <text x="46" y="310" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="16.5" fill="#52525B">已支持 3 个驱动</text>
    <text x="240" y="310" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" fill="#71717A">macOS · Windows · Linux&#160;&#160;·&#160;&#160;Apache-2.0</text>
  </g>

  <!-- one client, a driver per broker: each lane carries its own messages -->
  <g id="drivers">
    <rect x="700" y="175" width="44" height="44" rx="9.9" fill="#EC3013"/>
    <g transform="translate(706.43 185.38) scale(0.23239)" fill="none" stroke-width="10">
      <path d="M12 74 L12 26 L34 55 L56 26 L56 74" stroke="#F3F2F2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="98" cy="50" r="24" stroke="#F3F2F2"/>
      <line x1="109" y1="63" x2="120" y2="74" stroke="#201E1D" stroke-linecap="round"/>
    </g>
    <line x1="744" y1="197" x2="768" y2="197" stroke="#D4D4D8" stroke-width="1.5"/>
    <line x1="768" y1="88" x2="768" y2="252" stroke="#D4D4D8" stroke-width="1.5"/>
    <line x1="768" y1="252" x2="768" y2="306" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="5 6"/>
    <line x1="776" y1="88" x2="798" y2="88" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="884" y="93" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#52525B">RocketMQ</text>
    <line x1="896" y1="88" x2="1178" y2="88" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="768" cy="88" r="4.5" fill="#71717A"/>
    <circle cx="1178" cy="88" r="5.5" fill="none" stroke="#71717A" stroke-width="2"/>
    <rect x="918" y="73" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="972" y="73" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="1026" y="73" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="1104" y="73" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <line x1="776" y1="170" x2="798" y2="170" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="884" y="175" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#52525B">RabbitMQ</text>
    <line x1="896" y1="170" x2="1178" y2="170" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="768" cy="170" r="4.5" fill="#71717A"/>
    <circle cx="1178" cy="170" r="5.5" fill="none" stroke="#71717A" stroke-width="2"/>
    <rect x="910" y="155" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="964" y="155" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="1120" y="155" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="1042" y="153" width="34" height="34" rx="10" fill="#EC3013"/>
    <line x1="776" y1="252" x2="825" y2="252" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="884" y="257" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#52525B">Kafka</text>
    <line x1="896" y1="252" x2="1178" y2="252" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="768" cy="252" r="4.5" fill="#71717A"/>
    <circle cx="1178" cy="252" r="5.5" fill="none" stroke="#71717A" stroke-width="2"/>
    <rect x="924" y="237" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="978" y="237" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="1056" y="237" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <rect x="1110" y="237" width="30" height="30" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
    <line x1="776" y1="306" x2="810" y2="306" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="884" y="311" text-anchor="end" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="15" fill="#A1A1AA">更多驱动</text>
    <line x1="896" y1="306" x2="1178" y2="306" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="6 7"/>
    <circle cx="768" cy="306" r="4.5" fill="none" stroke="#A1A1AA" stroke-width="1.5"/>
    <circle cx="1178" cy="306" r="5.5" fill="none" stroke="#A1A1AA" stroke-width="2"/>
  </g>

  <!-- magnifier echoing the logo's Q: any driver, same inspection -->
  <g id="inspect">
    <circle cx="1059" cy="170" r="31" fill="none" stroke="#18181B" stroke-width="3.5"/>
    <line x1="1081" y1="192" x2="1104" y2="215" stroke="#18181B" stroke-width="7.5" stroke-linecap="round"/>
  </g>
</svg>
