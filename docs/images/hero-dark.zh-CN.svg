<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">MQ Studio</title>
  <desc id="d">MQ Studio：本地优先的消息队列桌面客户端。一套界面连接 RocketMQ、RabbitMQ、Kafka、Pulsar、Redis Stream、MQTT、NATS、ActiveMQ、NSQ、Amazon SQS、Google Pub/Sub、Azure Service Bus、Amazon Kinesis、IBM MQ 与 Solace PubSub+，无需部署 Web 控制台。</desc>

  <!-- eyebrow -->
  <text x="10" y="50" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" letter-spacing="3" fill="#9B9BA3">LOCAL-FIRST · NOTHING TO DEPLOY · OPEN SOURCE</text>

  <!-- logo tile + wordmark -->
  <g id="lockup">
    <rect x="10" y="76" width="88" height="88" rx="19.8" fill="#EC3013"/>
    <g transform="translate(18.757 84.757) scale(0.70485)">
      <path d="M50 14A36 36 0 0 1 74.9 24H25.1A36 36 0 0 1 50 14ZM20.407 29.5H79.593A36 36 0 0 1 84.435 39.5H15.565A36 36 0 0 1 20.407 29.5ZM15.565 60.5H84.435A36 36 0 0 1 79.593 70.5H20.407A36 36 0 0 1 15.565 60.5ZM25.1 76H74.9A36 36 0 0 1 50 86A36 36 0 0 1 25.1 76ZM14.349 45H28A5 5 0 0 1 28 55H14.349A36 36 0 0 1 14.349 45ZM72 45H85.651A36 36 0 0 1 85.651 55H72A5 5 0 0 1 72 45Z" fill="#F3F2F2"/>
      <rect x="39" y="45" width="22" height="10" rx="5" fill="#201E1D"/>
    </g>
    <text x="126" y="142" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="60" font-weight="800" letter-spacing="-1" fill="#F4F4F5">MQ Studio</text>
  </g>

  <!-- value -->
  <text x="10" y="219" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="30" font-weight="600" letter-spacing="1" fill="#C8C8CE">消息队列桌面客户端</text>
  <text x="10" y="255" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="20.5" fill="#9B9BA3">管理集群、Topic、消费者与消息 — 无需部署 Web 控制台。</text>

  <!-- metadata -->
  <g id="meta">
    <rect x="10" y="286" width="202" height="36" rx="18" fill="none" stroke="#2E2E33" stroke-width="1.5"/>
    <circle cx="32" cy="304" r="4.5" fill="#3DBB81"/>
    <text x="46" y="310" font-family="-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="16.5" fill="#B4B4BC">已支持 15 个驱动</text>
    <text x="240" y="310" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" fill="#9B9BA3">macOS · Windows · Linux&#160;&#160;·&#160;&#160;Apache-2.0</text>
  </g>

