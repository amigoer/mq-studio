# Pristine seed for the ACL E2E broker. Copied to plain_acl.yml by up.sh.
#
# The broker keeps its ACL in memory and flushes it back over plain_acl.yml, so
# that file is generated and gitignored - never edit it, edit this.
#
# The whitelist deliberately covers nobody. RocketMQ matches it before it looks
# at a signature at all, so a list covering the caller makes every ACL test pass
# whatever the credentials say - which is what it did for as long as the client
# signed nothing. 127.0.0.1 is here rather than an empty list because it is a
# real strategy that never matches: the client reaches the broker through the
# Docker gateway (172.x), never from loopback.
#
# Do not empty it. An empty list read from this file means no strategy and
# refuses everyone, but UPDATE_GLOBAL_WHITE_ADDRS sends the list as one comma
# separated string, and the empty string becomes RocketMQ's null strategy -
# which matches every caller and silently turns the whole ACL off.
#
# Formats are exact addresses, `a.b.*.*` wildcards or `a.b.c.1-200` ranges -
# not CIDR. A CIDR entry fails ACL initialisation and the broker then never
# registers with the name server.
globalWhiteRemoteAddresses:
  - 127.0.0.1

accounts:
  - accessKey: mqstudio
    secretKey: mqstudio-secret
    whiteRemoteAddress:
    admin: true
