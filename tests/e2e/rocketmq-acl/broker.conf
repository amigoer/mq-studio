brokerClusterName=AclCluster
brokerName=broker-acl
brokerId=0
brokerIP1=127.0.0.1
listenPort=10921
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroupEnable=true

# ACL 1.0 (plain_acl.yml). This is the ACL the driver's AccessAdmin targets:
# UpdatePlainAccessConfig, DeletePlainAccessConfig and UpdateGlobalWhiteAddrs
# are all request codes 50-53.
#
# Deliberately not ACL 2.0: its metadata providers need RocksDB, which the
# image ships no aarch64 JNI for, so the broker will not start on Apple Silicon
# without amd64 emulation - and the driver does not speak ACL 2.0 anyway.
aclEnable=true
