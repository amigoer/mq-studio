# Shared by all three servers.
#
# What differs per node - its name, and the address it hands clients so they
# can reach it directly - is passed on the command line instead, so there is
# one file to read rather than three that have to be kept in step.

# The monitoring endpoint: one of the four tiers the driver probes, and the
# only source of a server's own figures when no system account is configured.
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
}

cluster {
  name: mqstudio
  listen: 0.0.0.0:6222
  # Listing every node including this one is deliberate: a server ignores a
  # route to itself, which is what lets all three share one file.
  routes: [
    nats://nats-1:6222
    nats://nats-2:6222
    nats://nats-3:6222
  ]
}

accounts {
  # What the app connects as.
  #
  # JetStream is enabled per account as well as per server, and the limits are
  # written out rather than left unlimited so the overview has real figures to
  # divide by - an account with no cap reports -1, and a usage meter against
  # -1 is a meter that can never move.
  APP: {
    jetstream: { max_mem: 64MB, max_file: 1GB, max_streams: 100, max_consumers: 1000 }
    users: [ { user: mqstudio, password: mqstudio } ]
  }

  # An account with JetStream withheld, and no other purpose.
  #
  # A server built without JetStream and an account not permitted to use it
  # are two different failures that a driver has to report differently - one
  # is the operator's build, the other is their account configuration - and
  # they arrive as two different error codes. tests/e2e/nats-plain covers the
  # first; this account is the only way to reach the second against a real
  # broker rather than only against an in-process fixture.
  NOJS: {
    users: [ { user: nojs, password: nojs } ]
  }

  # The system account. $SYS.REQ.* is the only way to ask the whole cluster a
  # question in one request - the monitoring endpoint above answers for the
  # one server it belongs to and nothing else.
  SYS: {
    users: [ { user: sys, password: sys } ]
  }
}

system_account: SYS
