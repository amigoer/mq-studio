# The plain broker: a $SYS tree and nothing else.
#
# Mosquitto has no management API at all, which is the point of this
# environment. It is the case the driver has to report as "this broker does not
# offer that" rather than as a broken connection, and the only way to test that
# path is against a broker that genuinely does not offer it.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# The live tests connect without credentials. Authentication is exercised
# against the in-process broker in the unit tests, where a rejected password
# can be provoked without a password file to hash.
allow_anonymous true

# How often the $SYS tree is refreshed. The default is 10 seconds, which every
# test reading a counter would have to wait out; the values are published
# retained, so a subscriber still gets the current ones immediately.
sys_interval 1

persistence false
log_dest stdout
