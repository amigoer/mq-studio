# One server with JetStream off and no system account.
#
# Two of the driver's four tiers are therefore absent here, and each has to be
# reported for what it is: a server built without JetStream is not an account
# that lacks permission for it, and a connection with no system credentials is
# not one whose credentials were refused.
#
# The monitoring endpoint stays on, and that is the point rather than an
# oversight. It is a real deployment - plenty of servers run core NATS with
# monitoring and nothing else - and it is the case that proves the servers and
# connections boards still work with the two tiers above them missing.
http: 0.0.0.0:8222

authorization {
  user: mqstudio
  password: mqstudio
}
