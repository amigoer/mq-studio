<?xml version="1.0" encoding="UTF-8"?>
<!--
  DMG window background. 600x400 matches window_rect in settings.py; the two
  icon slots sit at x=150 and x=450, centred on y=200, so the arrow and the
  slot rings have to stay in step with icon_locations there.

  Deliberately carries no logo: the app mark is being redrawn, and this file
  should not need reissuing when it lands.

  Regenerate the PNGs after editing (needs a headless Chromium; the local
  ImageMagick has no librsvg delegate and renders text badly):
    node scripts/render-dmg-background.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfd"/>
      <stop offset="55%" stop-color="#f3f5f8"/>
      <stop offset="100%" stop-color="#e9edf2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Slot rings: a hint of where each icon lands, sized just outside the 128px icons. -->
  <g fill="none" stroke="#d3dae3" stroke-width="1.5" stroke-dasharray="5 6">
    <rect x="80" y="130" width="140" height="140" rx="28"/>
    <rect x="380" y="130" width="140" height="140" rx="28"/>
  </g>

  <!-- Drag arrow, spanning the gap between the two slots. A solid fill, not a
       gradient: a horizontal line has a zero-height bounding box, which makes
       an objectBoundingBox gradient collapse and the shaft disappear. -->
  <g fill="#9aa7b8">
    <rect x="244" y="196" width="94" height="8" rx="4"/>
    <path d="M332 182 L360 200 L332 218 Z"/>
  </g>

  <text x="300" y="330" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', sans-serif"
        font-size="15" font-weight="500" fill="#5b6675">
    将 MQ Studio 拖入 Applications 完成安装
  </text>
  <text x="300" y="354" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="13" fill="#8b96a5">
    Drag MQ Studio into Applications to install
  </text>
</svg>
