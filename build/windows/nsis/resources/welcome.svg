<?xml version="1.0" encoding="UTF-8"?>
<!--
  NSIS MUI_WELCOMEFINISHPAGE_BITMAP artwork. Must end up 164x314 and 24-bit
  BMP3: a 32-bit BMP with an alpha channel renders with a black band on several
  Windows versions.

  Regenerate the BMPs after editing:
    node scripts/render-nsis-bitmaps.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2b3442"/>
      <stop offset="55%" stop-color="#3a4657"/>
      <stop offset="100%" stop-color="#59667a"/>
    </linearGradient>
  </defs>

  <rect width="164" height="314" fill="url(#panel)"/>

  <!-- A queue: messages moving through a broker, drawn plainly enough that it
       survives the 24-bit downconvert. -->
  <g opacity="0.9">
    <g fill="#8ea3c0">
      <rect x="26" y="120" width="22" height="14" rx="3"/>
      <rect x="26" y="142" width="22" height="14" rx="3" opacity="0.75"/>
      <rect x="26" y="164" width="22" height="14" rx="3" opacity="0.5"/>
    </g>
    <rect x="66" y="118" width="34" height="62" rx="6" fill="none" stroke="#b9c8dc" stroke-width="2"/>
    <g fill="#cbd7e6">
      <rect x="118" y="120" width="22" height="14" rx="3"/>
      <rect x="118" y="142" width="22" height="14" rx="3" opacity="0.75"/>
      <rect x="118" y="164" width="22" height="14" rx="3" opacity="0.5"/>
    </g>
    <g stroke="#7d8ea8" stroke-width="2" fill="none">
      <path d="M52 127 H62"/>
      <path d="M104 127 H114"/>
    </g>
  </g>

  <text x="82" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif"
        font-size="17" font-weight="600" fill="#f2f5f9">MQ Studio</text>
  <text x="82" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif"
        font-size="10" fill="#9fb0c6">Message queue client</text>
</svg>
