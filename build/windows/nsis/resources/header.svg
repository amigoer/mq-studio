<?xml version="1.0" encoding="UTF-8"?>
<!--
  NSIS MUI_HEADERIMAGE_BITMAP artwork. Must end up 150x57 and 24-bit BMP3.
  MUI draws it right-aligned on a white header strip, so the background here
  stays white to blend into it.

  Regenerate the BMPs after editing:
    node scripts/render-nsis-bitmaps.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <rect width="150" height="57" fill="#ffffff"/>
  <g opacity="0.95">
    <g fill="#7f8fa6">
      <rect x="30" y="18" width="14" height="8" rx="2"/>
      <rect x="30" y="31" width="14" height="8" rx="2" opacity="0.7"/>
    </g>
    <rect x="56" y="16" width="22" height="25" rx="4" fill="none" stroke="#4a5768" stroke-width="1.6"/>
    <g fill="#4a5768">
      <rect x="90" y="18" width="14" height="8" rx="2"/>
      <rect x="90" y="31" width="14" height="8" rx="2" opacity="0.7"/>
    </g>
    <g stroke="#9aa7b8" stroke-width="1.4" fill="none">
      <path d="M46 22 H54"/>
      <path d="M80 22 H88"/>
    </g>
  </g>
</svg>
