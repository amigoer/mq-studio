# Runs the same gate as `npm run check` locally: version consistency, gofmt,
# go vet, frontend type checks, unit tests, and generated-binding drift.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Same list as the push filter: a docs-only change is treated the same way
  # whether it arrives as a PR or as a push. Actions has no YAML anchors, so
  # the two lists have to be kept in step by hand.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Names the CI artifacts <version>+<short sha> so a downloaded build can
      # be traced back to its commit without opening the run.
      - name: Resolve the build version
        id: meta
        shell: bash
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Compiling the Wails packages needs the GTK and WebKit headers even
      # though nothing is packaged here. GTK 4 rather than 3: every Linux file
      # in wails v3 that pulls gtk+-3.0 is behind a `gtk3` build tag, which
      # nothing here sets, so the default build wants gtk4 and webkitgtk-6.0.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      # The binding drift check regenerates them, so the CLI has to match the
      # version the module pins.
      - name: Install the Wails CLI
        run: |
          set -eu
          wails_version="$(awk '/github.com\/wailsapp\/wails\/v3/ { print $2; exit }' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # The rabbitmq conformance tests skip when the broker is absent so a
      # checkout without docker still has a green suite, but fail outright when
      # CI is set - the contract they assert is worthless if CI can silently
      # skip it. Same compose file a developer runs, so the image, the
      # credentials and the management plugin match.
      - name: Start RabbitMQ
        run: npm run e2e:rabbitmq:up

      # A second broker with none of the optional plugins. What a missing
      # plugin degrades to cannot be asserted against the first one, which
      # turns them on so their pages have something to read.
      - name: Start the plugin-free RabbitMQ
        run: npm run e2e:rabbitmq:plain:up

      # Three Kafka brokers. The kafka driver's live tests gate the same way
      # the rabbitmq ones do - skip when nothing answers, fail outright when
      # CI is set - so the cluster has to be up before the checks run or every
      # commit from the driver onwards is red.
      - name: Start Kafka
        run: npm run e2e:kafka:up

      # A second cluster with SASL and an authorizer. What a rejected
      # credential looks like and what an ACL round trip does cannot be
      # asserted against the first one, which runs without either.
      - name: Start the secure Kafka
        run: npm run e2e:kafka:secure:up

      - name: Run checks
        run: npm run check

  # Exercises the real packaging path for all six targets. It is skipped on pull
  # requests to keep review feedback fast, but running it on every push to main
  # means a packaging break surfaces then rather than on release day, which is
  # when it used to.
  package:
    name: Package
    if: github.event_name != 'pull_request'
    needs: check
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      package-version: ${{ needs.check.outputs.version }}
      sign: false
      retention-days: 7
    # No secrets passed: an unsigned build has no use for the signing material,
    # and every matrix job would otherwise have it in scope.
