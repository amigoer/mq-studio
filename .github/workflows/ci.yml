# Continuous integration for the Electron desktop app + Go daemon.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Avoid interactive electron/electron-builder prompts in CI.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Format, typecheck, tests, and OpenAPI contract
        run: npm run check

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
            arch: arm64
          - runner: macos-latest
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: windows-latest
            platform: win
            arch: arm64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # Internal CI packages are unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenjp2-tools \
            rpm \
            xvfb

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build Go daemon for target
        shell: bash
        run: sh scripts/build-daemon.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Build Electron main / preload / renderer
        run: npm --prefix desktop run build

      - name: Package with electron-builder
        shell: bash
        run: |
          cd desktop
          npx electron-builder \
            --${{ matrix.platform }} \
            --${{ matrix.arch }} \
            --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: rocket-leaf-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*
            !release/*-unpacked/**
            !release/mac/**
            !release/mac-arm64/**
            !release/mac-universal/**
            !release/win-unpacked/**
            !release/win-arm64-unpacked/**
            !release/linux-unpacked/**
            !release/linux-arm64-unpacked/**
          if-no-files-found: error
          retention-days: 14
