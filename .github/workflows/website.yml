# Gates the marketing site. ci.yml ignores website/** because none of its Go
# toolchain, GTK headers or broker clusters apply here and all of them are slow;
# this is the cheap job that runs in their place.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/fetch-release.mjs'
      - 'scripts/fetch-community.mjs'
      - '.github/workflows/website.yml'
      # The screenshots are read straight out of the docs tree, so a replaced
      # image can break the build without touching website/.
      - 'docs/images/readme/**'
      # The changelog and the docs pages are made from these, so an edit to
      # any of them has to rebuild the site.
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-CN.md'
      - 'docs/*.md'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/fetch-release.mjs'
      - 'scripts/fetch-community.mjs'
      - '.github/workflows/website.yml'
      - 'docs/images/readme/**'
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-CN.md'
      - 'docs/*.md'
  # release.yml publishes a draft, and the download page reads /releases/latest,
  # which does not see drafts. Rebuilding when the draft is created would pin the
  # site to the previous version, so the rebuild waits for publication instead.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix website

      # The changelog parser, the docs conversion and the CJK join rule are
      # hand-written; the tests pin them against lines from the real files.
      - name: Test
        run: npm --prefix website test

      # The build refreshes the release and community data from the network
      # first, falling back to the committed copies, then downloads the pinned
      # Kite release and checks it against the release's checksums. The token
      # lifts the anonymous 60/hour limit.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run website:build

      # What a build can lose without failing: pre-rendered downloads, the
      # head tags, one release per changelog page, the same routes in both
      # languages, links that resolve, and the script budget.
      - name: Verify the built site
        run: npm --prefix website run verify

  # Cloudflare builds from its own git integration, and that only ever sees a
  # push. Publishing a release is not one - it flips a flag on a tag that already
  # exists - so on its own it leaves the site serving the previous version until
  # something unrelated lands on main. Committing the refreshed release data is
  # that push. The same commit keeps the fallback copy current, which is what a
  # build serves when the API call does not work out.
  #
  # A push by GITHUB_TOKEN deliberately starts no workflow run, so this cannot
  # loop; Cloudflare hears it anyway, because its git integration is a GitHub App
  # webhook rather than an Actions trigger.
  refresh:
    name: Refresh the release data
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The release event points at the tag; the commit belongs on main. Full
      # history because the push below rebases if main moved.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The script reads whichever mirror answers first and falls back to the
      # committed copy rather than failing, so the tag has to be checked here:
      # committing the wrong version would serve it as though it were right.
      #
      # It is retried because promote.yml is pointing R2 at this release on the
      # same event, in parallel with this job - until it lands, and for up to
      # the 60s latest.json is cached for, the preferred mirror still serves the
      # release before this one.
      - name: Fetch the published release
        env:
          EXPECTED: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            node scripts/fetch-release.mjs
            got=$(node -p "require('./website/data/release.json').tag")
            if [ "$got" = "$EXPECTED" ]; then
              echo "release.json is at ${got}"
              exit 0
            fi
            echo "release.json says ${got}; waiting for the mirrors (${attempt}/6)"
            sleep 20
          done
          echo "no mirror served ${EXPECTED}" >&2
          exit 1

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if git diff --quiet -- website/data/release.json; then
            echo "release data is already current; nothing to push"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/data/release.json
          git commit -m "chore(website): refresh release data for ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
