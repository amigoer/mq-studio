name: Electron v2 Build Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run check

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
            arch: x64
          - runner: macos-latest
            platform: mac
            arch: arm64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: windows-latest
            platform: win
            arch: arm64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - name: Build target daemon
        shell: bash
        run: sh scripts/build-daemon.sh ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Build unsigned internal package
        shell: bash
        run: cd desktop && npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: rocket-leaf-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*
            !release/*-unpacked/**
          if-no-files-found: error
