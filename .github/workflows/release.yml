# Builds every target for a tag and publishes a draft GitHub Release.
#
# The release is left as a draft on purpose: the artifacts are meant to be
# downloaded and installed once by hand before anyone else can get them. The
# in-app update check only ever sees a published release.
#
# Optional macOS signing secrets (environment: release):
#   MACOS_SIGN_IDENTITY   Developer ID Application identity name
#   MACOS_CSC_LINK        base64 encoded .p12 certificate
#   MACOS_CSC_KEY_PASSWORD
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  (notarisation)
# Optional Windows signing secrets:
#   WINDOWS_CERTIFICATE   base64 encoded .pfx
#   WINDOWS_CERTIFICATE_PASSWORD
# With any of them missing that platform ships unsigned, and the macOS image
# carries the First Run helper that clears the quarantine flag for the user.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag, for example v1.4.0
        required: true
        type: string

concurrency:
  # inputs.tag is null on a tag push, so without the fallback every tag would
  # share a single group named "release-".
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate and resolve tag
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "checked out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      # The notes are only traceable if the sections name the issues they
      # answer. Checked here rather than in the packaging matrix: one run
      # instead of six, and it fails before the builds rather than after them.
      # The checkout above is fetch-depth: 0, which is what lets it find the
      # tag before this one.
      - name: Check the changelog names every issue this release closes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npm run check:refs

  package:
    name: Package
    needs: resolve
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      package-version: ${{ needs.resolve.outputs.version }}
      release-tag: ${{ needs.resolve.outputs.tag }}
      sign: true
      retention-days: 30
    # Listed explicitly rather than `secrets: inherit`, so the unsigned CI path
    # never has the signing material in scope.
    secrets:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  publish:
    name: Publish draft release
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release tag is unchanged
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved during packaging" >&2
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: packages-*
          merge-multiple: true

      # Each package job hashed its own output; this only joins them, so no
      # single job is trusted to attest for the others.
      - name: Collect the checksums
        shell: bash
        run: |
          set -eu
          cd release-files
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt
          find . -type f | sort

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The notes come from the committed changelogs, so a tag without a
      # changelog section fails here instead of publishing empty notes.
      - name: Build the release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          # Drives the "this build is unsigned" banner, so the draft documents
          # itself and the banner disappears on its own once a cert is set up.
          MACOS_SIGNED: ${{ secrets.MACOS_SIGN_IDENTITY != '' && secrets.MACOS_CSC_LINK != '' }}
        run: |
          set -eu
          # An absent predecessor is expected for the first release; the script
          # falls back to linking the changelog instead of a compare range.
          previous="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          PREVIOUS_TAG="$previous" node scripts/release-notes.mjs "$RELEASE_TAG" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # What the updater and the website read instead of the GitHub releases
      # API. Built here rather than in the packaging matrix because it names
      # every platform's digest, and it lands in release-files/ so it ships as
      # a release asset too - that is what makes GitHub a mirror that can
      # answer the check as well as serve the download.
      - name: Build the release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -eu
          node scripts/build-manifest.mjs \
            --dir release-files \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --out release-files/manifest.json
          cat release-files/manifest.json

      # Uploaded while the release is still a draft, deliberately. These keys
      # are version-scoped and nothing points at them until promote.yml writes
      # latest.json, so publishing stays one small write and the CDN is warm
      # before anyone can reach it.
      #
      # It also has to happen before that pointer flips rather than after: a
      # client resolves the manifest on whichever mirror answers first and may
      # fall back to a different one for the download itself, so every mirror
      # needs the packages in place the moment any mirror starts naming them.
      - name: Upload the release to R2
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          # The bucket serves several projects, so everything this one writes
          # lives under one prefix. It is the path half of the r2 mirror in
          # scripts/mirrors.json and has to stay equal to it, which is what
          # TestReleaseToolingUsesTheMirrorPrefix checks.
          R2_PREFIX: mq-studio
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the additional CRC32 integrity headers the AWS CLI has
          # sent by default since v2.23.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -eu
          configured=0
          for value in "${R2_BUCKET:-}" "${R2_ACCOUNT_ID:-}" \
                       "${AWS_ACCESS_KEY_ID:-}" "${AWS_SECRET_ACCESS_KEY:-}"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          # Absent is the expected state until the bucket exists: the release
          # still publishes, with GitHub as its only mirror. Partially set is
          # not - that is a typo away from a release nobody can download.
          if [ "$configured" -eq 0 ]; then
            echo '::warning::R2 is not configured; publishing to GitHub only.'
            exit 0
          fi
          if [ "$configured" -ne 4 ]; then
            echo 'R2 is partially configured. Needs variables R2_BUCKET and' >&2
            echo 'R2_ACCOUNT_ID, and secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY.' >&2
            exit 1
          fi
          aws s3 sync release-files "s3://${R2_BUCKET}/${R2_PREFIX}/${RELEASE_TAG}/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control 'public, max-age=31536000, immutable' \
            --no-progress

      - name: Create draft GitHub Release
        # v3 is the Node 24 runtime line; v2 targets the deprecated Node 20.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.commit }}
          name: MQ Studio ${{ needs.resolve.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release-files/*
          fail_on_unmatched_files: true
          draft: true
