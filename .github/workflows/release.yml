# Build Electron installers for all platforms and publish a GitHub Release.
#
# Optional signing secrets (environment: release):
#   MACOS_CSC_LINK / MACOS_CSC_KEY_PASSWORD
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#   WINDOWS_CSC_LINK / WINDOWS_CSC_KEY_PASSWORD
# When a platform's credentials are incomplete, that platform is packaged unsigned.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag, for example v1.4.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate and resolve tag
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "checked out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.platform }})
    needs: resolve
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
          - runner: windows-latest
            platform: win
          - runner: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CSC_LINK || matrix.platform == 'win' && secrets.WINDOWS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved after source resolution" >&2
            exit 1
          fi

      - name: Select signing mode
        id: signing
        shell: bash
        run: |
          set -eu
          enabled=false
          case '${{ matrix.platform }}' in
            mac)
              if [ -n "${CSC_LINK:-}" ] && \
                 [ -n "${CSC_KEY_PASSWORD:-}" ] && \
                 [ -n "${APPLE_ID:-}" ] && \
                 [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && \
                 [ -n "${APPLE_TEAM_ID:-}" ]; then
                enabled=true
              else
                echo '::warning::macOS signing credentials are incomplete; packaging unsigned installers.'
              fi
              ;;
            win)
              if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ]; then
                enabled=true
              else
                echo '::warning::Windows signing credentials are incomplete; packaging unsigned installers.'
              fi
              ;;
          esac
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run check:version

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenjp2-tools \
            rpm \
            xvfb

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build Go daemons (x64 + arm64)
        shell: bash
        run: |
          sh scripts/build-daemon.sh ${{ matrix.platform }} x64
          sh scripts/build-daemon.sh ${{ matrix.platform }} arm64

      - name: Build Electron main / preload / renderer
        run: npm --prefix desktop run build

      - name: Package installers
        shell: bash
        run: |
          set -eu
          cd desktop
          case '${{ matrix.platform }}' in
            mac)
              if [ '${{ steps.signing.outputs.enabled }}' = true ]; then
                npx electron-builder \
                  --mac --x64 --arm64 \
                  --publish never \
                  -c.mac.notarize=true
              else
                unset CSC_LINK CSC_KEY_PASSWORD
                unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
                CSC_IDENTITY_AUTO_DISCOVERY=false \
                  npx electron-builder \
                    --mac --x64 --arm64 \
                    --publish never \
                    -c.mac.notarize=false
              fi
              ;;
            win)
              if [ '${{ steps.signing.outputs.enabled }}' = true ]; then
                npx electron-builder \
                  --win --x64 --arm64 \
                  --publish never
              else
                unset CSC_LINK CSC_KEY_PASSWORD
                CSC_IDENTITY_AUTO_DISCOVERY=false \
                  npx electron-builder \
                    --win --x64 --arm64 \
                    --publish never
              fi
              ;;
            linux)
              # Linux AppImage is not code-signed with Apple/Windows certs.
              CSC_IDENTITY_AUTO_DISCOVERY=false \
                npx electron-builder \
                  --linux --x64 --arm64 \
                  --publish never
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*-mac-arm64.dmg
            release/*-mac-x64.dmg
            release/*-win-arm64.exe
            release/*-win-x64.exe
            release/*-linux-arm64.AppImage
            release/*-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release tag is unchanged
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved during packaging" >&2
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: installers-*
          merge-multiple: true

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.commit }}
          name: Rocket Leaf ${{ inputs.tag }}
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
