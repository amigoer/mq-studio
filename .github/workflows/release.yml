# Build Wails packages for every target and publish a GitHub Release.
#
# Runner choice follows what each platform needs to build:
#   macOS   CGO, both slices from one SDK, joined with lipo -> one universal job
#   Windows CGO_ENABLED=0, so amd64 and arm64 cross-compile from one runner
#   Linux   CGO, so each architecture needs a runner of its own
#
# Optional macOS signing secrets (environment: release):
#   MACOS_SIGN_IDENTITY   Developer ID Application identity name
#   MACOS_CSC_LINK        base64 encoded .p12 certificate
#   MACOS_CSC_KEY_PASSWORD
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  (notarisation)
# With any of them missing the macOS build ships ad-hoc signed, which is what
# the Taskfile's package step produces on its own.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag, for example v1.4.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate and resolve tag
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "checked out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.target }})
    needs: resolve
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS and Windows cross-compile between architectures on one
          # runner; Linux needs cgo, so each architecture builds natively.
          - runner: macos-latest
            target: mac-amd64
            os: mac
            arch: amd64
          - runner: macos-latest
            target: mac-arm64
            os: mac
            arch: arm64
          - runner: windows-latest
            target: windows-amd64
            os: windows
            arch: amd64
          - runner: windows-latest
            target: windows-arm64
            os: windows
            arch: arm64
          - runner: ubuntu-latest
            target: linux-amd64
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved after source resolution" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Building the CLI links against GTK and WebKit, so the libraries have
      # to be present before it is installed.
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            rpm \
            file

      # Chocolatey does not export makensis to later steps, so add it here.
      - name: Install NSIS
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -eu
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      # The CLI bundles Task, so no separate Task install is needed.
      - name: Install the Wails CLI
        shell: bash
        run: |
          set -eu
          wails_version="$(awk '/github.com\/wailsapp\/wails\/v3/ { print $2; exit }' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run check:version

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Every package is published as rocket-leaf-<version>-<os>-<arch>.<ext>.
      # The packaging tools each name their output differently, so the canonical
      # name is resolved once here and applied below.
      - name: Resolve the package name
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          echo "PACKAGE_BASE=rocket-leaf-${RELEASE_TAG#v}-${{ matrix.os }}-${{ matrix.arch }}" \
            >> "$GITHUB_ENV"

      # ARCH has to be an environment variable throughout: a Task CLI variable
      # does not reach the nested build and syso tasks, which would then
      # silently build the runner's own architecture instead.
      - name: Package the macOS bundle
        if: matrix.os == 'mac'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: wails3 task darwin:package

      - name: Sign and notarise the macOS bundle
        if: matrix.os == 'mac'
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          if [ -z "${SIGN_IDENTITY:-}" ] || [ -z "${CSC_LINK:-}" ] || \
             [ -z "${CSC_KEY_PASSWORD:-}" ] || [ -z "${APPLE_ID:-}" ] || \
             [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            # Not a warning: shipping ad-hoc signed is the expected result when
            # no signing secrets are configured.
            echo 'macOS signing credentials are not configured; shipping the ad-hoc signed bundle.'
            exit 0
          fi
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$CSC_LINK" | base64 --decode > "$certificate"
          # notarytool reads the Apple credentials from a keychain profile.
          xcrun notarytool store-credentials release-notarize \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          wails3 tool sign \
            -input "bin/Rocket Leaf.app" \
            -certificate "$certificate" \
            -password "$CSC_KEY_PASSWORD" \
            -identity "$SIGN_IDENTITY" \
            -notarize \
            -keychain-profile release-notarize
          rm -f "$certificate"

      - name: Build the macOS disk image
        if: matrix.os == 'mac'
        shell: bash
        run: |
          set -eu
          # `wails3 tool package -format dmg` is disabled in the pinned CLI and
          # exits 0 without producing anything, so build the image directly.
          image="bin/${PACKAGE_BASE}.dmg"
          hdiutil create \
            -volname "Rocket Leaf" \
            -srcfolder "bin/Rocket Leaf.app" \
            -ov -format UDZO \
            "$image"
          hdiutil verify "$image"

      - name: Package the Windows installer
        if: matrix.os == 'windows'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: wails3 task windows:package

      # AppImage only: the deb, rpm and archlinux packages are named without the
      # architecture, so the two Linux jobs would overwrite each other's files
      # when the artifacts are merged.
      - name: Package the Linux AppImage
        if: matrix.os == 'linux'
        shell: bash
        run: wails3 task linux:create:appimage

      # NSIS names the installer after the product and AppImage after the GNU
      # architecture, so both are renamed onto the canonical scheme.
      - name: Normalise the package name
        if: matrix.os != 'mac'
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          case '${{ matrix.os }}' in
            windows) produced=(bin/*installer.exe); extension=exe ;;
            linux)   produced=(bin/*.AppImage);     extension=AppImage ;;
          esac
          if [ "${#produced[@]}" -ne 1 ]; then
            echo "expected exactly one package, found ${#produced[@]}: ${produced[*]-none}" >&2
            exit 1
          fi
          mv "${produced[0]}" "bin/${PACKAGE_BASE}.${extension}"

      - name: List packaged files
        shell: bash
        run: find bin -maxdepth 1 -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: bin/${{ env.PACKAGE_BASE }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release tag is unchanged
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved during packaging" >&2
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: packages-*
          merge-multiple: true

      - name: List release files
        run: find release-files -type f | sort

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The notes come from the committed changelogs, so a tag without a
      # changelog section fails here instead of publishing empty notes.
      - name: Build the release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # An absent predecessor is expected for the first release; the script
          # falls back to linking the changelog instead of a compare range.
          previous="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          PREVIOUS_TAG="$previous" node scripts/release-notes.mjs "$RELEASE_TAG" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        # v3 is the Node 24 runtime line; v2 targets the deprecated Node 20.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.commit }}
          name: Rocket Leaf ${{ inputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release-files/*
          fail_on_unmatched_files: true
