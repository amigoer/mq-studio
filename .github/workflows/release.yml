name: Publish Signed Electron Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag, for example v2.0.0
        required: true

permissions:
  contents: read

jobs:
  package:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
          - runner: windows-latest
            platform: win
          - runner: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ matrix.platform == 'win' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }
      - name: Validate tag and signing credentials
        shell: bash
        run: |
          echo '${{ inputs.tag }}' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ '${{ matrix.platform }}' = mac ]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          fi
          if [ '${{ matrix.platform }}' = win ]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - shell: bash
        run: |
          sh scripts/build-daemon.sh ${{ matrix.platform }} x64
          sh scripts/build-daemon.sh ${{ matrix.platform }} arm64
      - shell: bash
        run: |
          cd desktop
          if [ '${{ matrix.platform }}' = mac ]; then
            npx electron-builder --mac --x64 --arm64 --publish never -c.mac.notarize=true
          else
            npx electron-builder --${{ matrix.platform }} --x64 --arm64 --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: |
            release/*
            !release/*-unpacked/**
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-files, pattern: signed-*, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release-files/*
