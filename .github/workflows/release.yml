# Build Wails packages for every target and publish a GitHub Release.
#
# Runner choice follows what each platform needs to build:
#   macOS   CGO, both slices from one SDK, joined with lipo -> one universal job
#   Windows CGO_ENABLED=0, so amd64 and arm64 cross-compile from one runner
#   Linux   CGO, so each architecture needs a runner of its own
#
# Optional macOS signing secrets (environment: release):
#   MACOS_SIGN_IDENTITY   Developer ID Application identity name
#   MACOS_CSC_LINK        base64 encoded .p12 certificate
#   MACOS_CSC_KEY_PASSWORD
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  (notarisation)
# With any of them missing the macOS build ships ad-hoc signed, which is what
# the Taskfile's package step produces on its own.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag, for example v1.4.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate and resolve tag
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "checked out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.target }})
    needs: resolve
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: mac-universal
          - runner: windows-latest
            target: windows
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved after source resolution" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The CLI bundles Task, so no separate Task install is needed.
      - name: Install the Wails CLI
        shell: bash
        run: |
          set -eu
          wails_version="$(awk '/github.com\/wailsapp\/wails\/v3/ { print $2; exit }' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run check:version

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            rpm \
            file

      - name: Install NSIS
        if: matrix.target == 'windows'
        shell: bash
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Package macOS universal bundle
        if: matrix.target == 'mac-universal'
        shell: bash
        run: wails3 task darwin:package:universal

      - name: Sign and notarise the macOS bundle
        if: matrix.target == 'mac-universal'
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          if [ -z "${SIGN_IDENTITY:-}" ] || [ -z "${CSC_LINK:-}" ] || \
             [ -z "${CSC_KEY_PASSWORD:-}" ] || [ -z "${APPLE_ID:-}" ] || \
             [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo '::warning::macOS signing credentials are incomplete; shipping the ad-hoc signed bundle.'
            exit 0
          fi
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$CSC_LINK" | base64 --decode > "$certificate"
          # notarytool reads the Apple credentials from a keychain profile.
          xcrun notarytool store-credentials release-notarize \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          wails3 tool sign \
            -input "bin/Rocket Leaf.app" \
            -certificate "$certificate" \
            -password "$CSC_KEY_PASSWORD" \
            -identity "$SIGN_IDENTITY" \
            -notarize \
            -keychain-profile release-notarize
          rm -f "$certificate"

      - name: Build the macOS disk image
        if: matrix.target == 'mac-universal'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # `wails3 tool package -format dmg` is disabled in the pinned CLI and
          # exits 0 without producing anything, so build the image directly.
          version="${RELEASE_TAG#v}"
          hdiutil create \
            -volname "Rocket Leaf" \
            -srcfolder "bin/Rocket Leaf.app" \
            -ov -format UDZO \
            "bin/Rocket-Leaf-${version}-mac-universal.dmg"
          hdiutil verify "bin/Rocket-Leaf-${version}-mac-universal.dmg"

      - name: Package Windows installers
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -eu
          # ARCH has to be an environment variable: passing it as a Task CLI
          # variable does not reach the nested build and syso tasks, which then
          # silently build the runner's own architecture for both installers.
          ARCH=amd64 wails3 task windows:package
          ARCH=arm64 wails3 task windows:package

      - name: Package Linux artifacts
        if: startsWith(matrix.target, 'linux')
        shell: bash
        run: wails3 task linux:package

      - name: List packaged files
        shell: bash
        run: find bin -maxdepth 1 -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: |
            bin/*.dmg
            bin/*installer.exe
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Verify release tag is unchanged
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -eu
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag moved during packaging" >&2
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: packages-*
          merge-multiple: true

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.commit }}
          name: Rocket Leaf ${{ inputs.tag }}
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
