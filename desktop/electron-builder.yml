appId: com.rocketleaf.app
productName: Rocket Leaf
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: ../release
  buildResources: resources
files:
  - out/**/*
  - '!out/build-metadata.json'
  - package.json
beforePack: scripts/build-integrity.cjs
asar: true
extraResources:
  - from: resources/bin/${os}/${arch}
    to: bin
    filter:
      - rocket-leafd*
  - from: resources/icon.png
    to: icon.png
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Enabled explicitly by the Release workflow (-c.mac.notarize=true) when Apple credentials are present.
  notarize: false

win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  category: Development
  target:
    - AppImage
publish:
  provider: github
  owner: amigoer
  repo: rocket-leaf
