version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  # APP_NAME names the binary; BUNDLE_NAME names the macOS .app the user sees.
  APP_NAME: "mq-studio"
  BUNDLE_NAME: "MQ Studio"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # package.json is the single source of truth for the version.
  APP_VERSION:
    sh: node -p "require('./package.json').version"
  LD_VERSION: '-X main.version={{.APP_VERSION}}'

tasks:
  build:
    summary: Builds the application for the current platform
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build for the current platform
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Builds and runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application with frontend hot reload
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  bindings:
    summary: Regenerates the TypeScript bindings from the Go services
    cmds:
      - wails3 generate bindings -clean=true -ts

  icons:
    summary: Regenerates the platform icons from build/appicon.png
    cmds:
      - task: common:generate:icons

  setup:docker:
    summary: Builds the Docker image used for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
